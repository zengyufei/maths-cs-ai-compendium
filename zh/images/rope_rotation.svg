<svg width="600" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="rope-arrow" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#555"/>
    </marker>
    <marker id="rope-arrow-blue" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#3498db"/>
    </marker>
    <marker id="rope-arrow-red" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#e74c3c"/>
    </marker>
  </defs>
  <text x="300" y="22" fill="#333" font-size="14" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="bold" text-anchor="middle">旋转位置嵌入（RoPE）</text>

  <!-- 2D plane -->
  <text x="170" y="48" fill="#666" font-size="11" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle">嵌入二维子空间中的旋转</text>

  <!-- Axes -->
  <line x1="40" y1="190" x2="310" y2="190" stroke="#ccc" stroke-width="1"/>
  <line x1="170" y1="60" x2="170" y2="280" stroke="#ccc" stroke-width="1"/>
  <text x="315" y="194" fill="#999" font-size="10">q_{2i}</text>
  <text x="175" y="58" fill="#999" font-size="10">q_{2i+1}</text>

  <!-- Original vector (position 0) -->
  <line x1="170" y1="190" x2="280" y2="115" stroke="#3498db" stroke-width="2.5" marker-end="url(#rope-arrow-blue)"/>
  <text x="285" y="110" fill="#3498db" font-size="11" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="bold">位置 0</text>
  <text x="285" y="125" fill="#3498db" font-size="9" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">（未旋转）</text>

  <!-- Rotated vector (position 3) -->
  <line x1="170" y1="190" x2="240" y2="82" stroke="#e74c3c" stroke-width="2.5" marker-end="url(#rope-arrow-red)"/>
  <text x="245" y="77" fill="#e74c3c" font-size="11" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="bold">位置 3</text>
  <text x="245" y="92" fill="#e74c3c" font-size="9" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">（旋转 3θ）</text>

  <!-- Rotated vector (position 7) -->
  <line x1="170" y1="190" x2="105" y2="95" stroke="#27ae60" stroke-width="2.5" marker-end="url(#rope-arrow)"/>
  <text x="62" y="88" fill="#27ae60" font-size="11" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="bold">位置 7</text>
  <text x="62" y="103" fill="#27ae60" font-size="9" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">（旋转 7θ）</text>

  <!-- Arc showing rotation angle -->
  <path d="M 240,155 A 50,50 0 0,1 260,135" fill="none" stroke="#f39c12" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="265" y="150" fill="#f39c12" font-size="10">3θ</text>

  <!-- Right side explanation -->
  <rect x="340" y="60" width="245" height="220" rx="8" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>

  <text x="462" y="85" fill="#333" font-size="11" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle" font-weight="bold">关键洞见</text>

  <text x="462" y="108" fill="#555" font-size="10" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle">每个位置 m 都会将查询/键</text>
  <text x="462" y="122" fill="#555" font-size="10" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle">按角度 mθ 旋转。</text>

  <text x="462" y="148" fill="#555" font-size="10" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle">点积 q'ᵀk' 只取决于</text>
  <text x="462" y="162" fill="#555" font-size="10" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle">角度差</text>
  <text x="462" y="176" fill="#e74c3c" font-size="11" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle" font-weight="bold">(m − n)θ = 相对位置</text>

  <line x1="370" y1="190" x2="555" y2="190" stroke="#ddd" stroke-width="1"/>

  <text x="462" y="212" fill="#555" font-size="10" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle">绝对位置会被编码，</text>
  <text x="462" y="226" fill="#555" font-size="10" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle">但注意力分数只感知</text>
  <text x="462" y="240" fill="#555" font-size="10" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle">相对距离。</text>

  <text x="462" y="265" fill="#27ae60" font-size="10" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle" font-weight="bold">可泛化到未见长度</text>
  <text x="462" y="278" fill="#666" font-size="9" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle">用于 LLaMA、Mistral、Gemma</text>
</svg>
