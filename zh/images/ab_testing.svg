<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 220" width="650" height="220">
  <defs>
    <marker id="ab-arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666"/>
    </marker>
  </defs>
  <text x="325" y="22" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">A/B 测试：衡量模型影响</text>

  <!-- Users -->
  <rect x="30" y="70" width="80" height="80" rx="10" fill="#555" fill-opacity="0.1" stroke="#555" stroke-width="1.5"/>
  <text x="70" y="105" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="10" font-weight="bold" fill="#555">全部用户</text>
  <text x="70" y="120" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="9" fill="#555">100%</text>

  <!-- Random split -->
  <line x1="110" y1="90" x2="175" y2="75" stroke="#3498db" stroke-width="2" marker-end="url(#ab-arr)"/>
  <line x1="110" y1="130" x2="175" y2="145" stroke="#e74c3c" stroke-width="2" marker-end="url(#ab-arr)"/>

  <text x="148" y="100" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="8" fill="#666">随机</text>
  <text x="148" y="112" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="8" fill="#666">分配</text>

  <!-- Control group -->
  <rect x="183" y="50" width="130" height="55" rx="8" fill="#3498db" fill-opacity="0.12" stroke="#3498db" stroke-width="2"/>
  <text x="248" y="72" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="10" font-weight="bold" fill="#3498db">对照组（50%）</text>
  <text x="248" y="88" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="9" fill="#3498db">旧模型 v1</text>
  <text x="248" y="100" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="8" fill="#3498db">CTR = 4.2%</text>

  <!-- Treatment group -->
  <rect x="183" y="115" width="130" height="55" rx="8" fill="#e74c3c" fill-opacity="0.12" stroke="#e74c3c" stroke-width="2"/>
  <text x="248" y="137" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="10" font-weight="bold" fill="#e74c3c">实验组（50%）</text>
  <text x="248" y="153" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="9" fill="#e74c3c">新模型 v2</text>
  <text x="248" y="165" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="8" fill="#e74c3c">CTR = 4.5%</text>

  <!-- Results -->
  <line x1="313" y1="77" x2="370" y2="110" stroke="#3498db" stroke-width="1.2" marker-end="url(#ab-arr)"/>
  <line x1="313" y1="142" x2="370" y2="115" stroke="#e74c3c" stroke-width="1.2" marker-end="url(#ab-arr)"/>

  <rect x="378" y="80" width="240" height="65" rx="10" fill="#27ae60" fill-opacity="0.06" stroke="#27ae60" stroke-width="1.5"/>
  <text x="498" y="100" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="10" font-weight="bold" fill="#27ae60">统计分析</text>
  <text x="498" y="118" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="9" fill="#27ae60">Δ CTR = +0.3%（p = 0.02，显著）</text>
  <text x="498" y="133" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="9" fill="#27ae60">护栏：延迟正常，错误正常</text>

  <!-- Decision -->
  <text x="498" y="170" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="10" font-weight="bold" fill="#27ae60">→ 向 100% 用户发布 v2</text>

  <text x="325" y="205" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="9" fill="#666">运行 1-2 周，覆盖周内效应并达到统计显著性</text>
</svg>
