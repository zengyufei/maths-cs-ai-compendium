<svg width="720" height="280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="rlhf-arrow" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#555"/>
    </marker>
  </defs>
  <text x="360" y="22" fill="#333" font-size="14" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="bold" text-anchor="middle">RLHF：来自人类反馈的强化学习</text>

  <!-- Stage 1: SFT -->
  <rect x="20" y="45" width="200" height="115" rx="10" fill="#3498db" opacity="0.06" stroke="#3498db" stroke-width="2"/>
  <text x="120" y="68" fill="#3498db" font-size="12" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="bold" text-anchor="middle">阶段 1：SFT</text>

  <rect x="40" y="78" width="160" height="24" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <text x="120" y="95" fill="#555" font-size="9" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle">人类撰写的回答</text>

  <line x1="120" y1="102" x2="120" y2="118" stroke="#555" stroke-width="1" marker-end="url(#rlhf-arrow)"/>

  <rect x="55" y="120" width="130" height="28" rx="5" fill="#3498db" opacity="0.15" stroke="#3498db" stroke-width="1.5"/>
  <text x="120" y="139" fill="#3498db" font-size="10" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle" font-weight="bold">SFT 模型</text>

  <!-- Arrow 1→2 -->
  <line x1="220" y1="100" x2="255" y2="100" stroke="#555" stroke-width="2" marker-end="url(#rlhf-arrow)"/>

  <!-- Stage 2: Reward Model -->
  <rect x="260" y="45" width="200" height="115" rx="10" fill="#e74c3c" opacity="0.06" stroke="#e74c3c" stroke-width="2"/>
  <text x="360" y="68" fill="#e74c3c" font-size="12" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="bold" text-anchor="middle">阶段 2：奖励模型</text>

  <rect x="278" y="78" width="70" height="24" rx="4" fill="#27ae60" opacity="0.15" stroke="#27ae60" stroke-width="1"/>
  <text x="313" y="94" fill="#27ae60" font-size="9" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle">回答 A</text>
  <rect x="355" y="78" width="70" height="24" rx="4" fill="#e74c3c" opacity="0.15" stroke="#e74c3c" stroke-width="1"/>
  <text x="390" y="94" fill="#e74c3c" font-size="9" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle">回答 B</text>

  <text x="432" y="94" fill="#333" font-size="9" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">人类</text>
  <text x="432" y="106" fill="#333" font-size="9" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">排序</text>

  <line x1="360" y1="102" x2="360" y2="118" stroke="#555" stroke-width="1" marker-end="url(#rlhf-arrow)"/>

  <rect x="295" y="120" width="130" height="28" rx="5" fill="#e74c3c" opacity="0.15" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="360" y="139" fill="#e74c3c" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="bold">奖励 r(x, y)</text>

  <!-- Arrow 2→3 -->
  <line x1="460" y1="100" x2="495" y2="100" stroke="#555" stroke-width="2" marker-end="url(#rlhf-arrow)"/>

  <!-- Stage 3: RL Fine-tuning -->
  <rect x="500" y="45" width="205" height="115" rx="10" fill="#27ae60" opacity="0.06" stroke="#27ae60" stroke-width="2"/>
  <text x="602" y="68" fill="#27ae60" font-size="12" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="bold" text-anchor="middle">阶段 3：RL（PPO）</text>

  <rect x="518" y="78" width="80" height="24" rx="4" fill="#3498db" opacity="0.15" stroke="#3498db" stroke-width="1"/>
  <text x="558" y="95" fill="#3498db" font-size="9" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle">LM 生成</text>

  <rect x="608" y="78" width="80" height="24" rx="4" fill="#e74c3c" opacity="0.15" stroke="#e74c3c" stroke-width="1"/>
  <text x="648" y="95" fill="#e74c3c" font-size="9" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle">RM 打分</text>

  <line x1="602" y1="102" x2="602" y2="118" stroke="#555" stroke-width="1" marker-end="url(#rlhf-arrow)"/>

  <rect x="537" y="120" width="130" height="28" rx="5" fill="#27ae60" opacity="0.15" stroke="#27ae60" stroke-width="1.5"/>
  <text x="602" y="139" fill="#27ae60" font-size="10" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle" font-weight="bold">RLHF 模型</text>

  <!-- Bottom: DPO comparison -->
  <rect x="120" y="185" width="480" height="80" rx="10" fill="#9b59b6" opacity="0.05" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="360" y="208" fill="#9b59b6" font-size="12" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="bold" text-anchor="middle">DPO：直接偏好优化（更简单的替代方案）</text>

  <text x="360" y="228" fill="#555" font-size="10" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle">完全跳过奖励模型。以分类损失直接在偏好对上训练。</text>
  <text x="360" y="245" fill="#555" font-size="10" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle">数学上等价于 RLHF，但没有 PPO、没有奖励模型，只有监督训练。</text>
  <text x="360" y="260" fill="#9b59b6" font-size="9" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle">阶段 2 + 3 合并为一步：比较偏好与不偏好补全的对数概率。</text>
</svg>
