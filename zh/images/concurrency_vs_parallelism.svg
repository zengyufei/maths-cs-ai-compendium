<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" width="700" height="220">
  <text x="350" y="22" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">并发与并行</text>

  <line x1="350" y1="35" x2="350" y2="210" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Concurrency (left) - one core, interleaved -->
  <text x="175" y="52" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="12" font-weight="bold" fill="#3498db">并发（1 个核心）</text>
  <text x="175" y="68" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="9" fill="#3498db">交错执行</text>

  <text x="40" y="100" text-anchor="start" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="10" fill="#666">核心：</text>

  <!-- Time blocks interleaved -->
  <rect x="80" y="85" width="40" height="24" rx="3" fill="#e74c3c" fill-opacity="0.4" stroke="#e74c3c" stroke-width="1"/>
  <text x="100" y="101" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="8" font-weight="bold" fill="#e74c3c">A</text>
  <rect x="122" y="85" width="30" height="24" rx="3" fill="#3498db" fill-opacity="0.4" stroke="#3498db" stroke-width="1"/>
  <text x="137" y="101" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="8" font-weight="bold" fill="#3498db">B</text>
  <rect x="154" y="85" width="35" height="24" rx="3" fill="#e74c3c" fill-opacity="0.4" stroke="#e74c3c" stroke-width="1"/>
  <text x="171" y="101" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="8" font-weight="bold" fill="#e74c3c">A</text>
  <rect x="191" y="85" width="25" height="24" rx="3" fill="#27ae60" fill-opacity="0.4" stroke="#27ae60" stroke-width="1"/>
  <text x="203" y="101" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="8" font-weight="bold" fill="#27ae60">C</text>
  <rect x="218" y="85" width="30" height="24" rx="3" fill="#3498db" fill-opacity="0.4" stroke="#3498db" stroke-width="1"/>
  <text x="233" y="101" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="8" font-weight="bold" fill="#3498db">B</text>
  <rect x="250" y="85" width="40" height="24" rx="3" fill="#27ae60" fill-opacity="0.4" stroke="#27ae60" stroke-width="1"/>
  <text x="270" y="101" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="8" font-weight="bold" fill="#27ae60">C</text>

  <!-- Time arrow -->
  <line x1="80" y1="125" x2="300" y2="125" stroke="#999" stroke-width="1"/>
  <text x="310" y="129" text-anchor="start" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="8" fill="#999">时间 →</text>
  <text x="175" y="155" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="9" fill="#666">任务在一个核心上轮流执行</text>
  <text x="175" y="170" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="9" fill="#666">并非真正同时</text>

  <!-- Parallelism (right) - multiple cores, simultaneous -->
  <text x="525" y="52" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">并行（4 个核心）</text>
  <text x="525" y="68" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="9" fill="#27ae60">同时执行</text>
  <text x="380" y="93" text-anchor="start" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="9" fill="#666">核心 1：</text>
  <text x="380" y="113" text-anchor="start" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="9" fill="#666">核心 2：</text>
  <text x="380" y="133" text-anchor="start" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="9" fill="#666">核心 3：</text>
  <text x="380" y="153" text-anchor="start" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="9" fill="#666">核心 4：</text>
  <rect x="440" y="80" width="200" height="18" rx="3" fill="#e74c3c" fill-opacity="0.4" stroke="#e74c3c" stroke-width="1"/>
  <text x="540" y="93" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="8" font-weight="bold" fill="#e74c3c">任务 A</text>
  <rect x="440" y="100" width="200" height="18" rx="3" fill="#3498db" fill-opacity="0.4" stroke="#3498db" stroke-width="1"/>
  <text x="540" y="113" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="8" font-weight="bold" fill="#3498db">任务 B</text>
  <rect x="440" y="120" width="200" height="18" rx="3" fill="#27ae60" fill-opacity="0.4" stroke="#27ae60" stroke-width="1"/>
  <text x="540" y="133" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="8" font-weight="bold" fill="#27ae60">任务 C</text>
  <rect x="440" y="140" width="200" height="18" rx="3" fill="#f39c12" fill-opacity="0.4" stroke="#f39c12" stroke-width="1"/>
  <text x="540" y="153" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="8" font-weight="bold" fill="#f39c12">任务 D</text>
  <text x="525" y="180" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="9" fill="#666">全部任务同一时间运行</text>
  <text x="525" y="195" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="9" fill="#666">需要多个核心</text>
</svg>
