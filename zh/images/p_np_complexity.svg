<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <text x="300" y="22" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">复杂性类别：P、NP 与 NP 完全</text>

  <!-- NP outer ellipse -->
  <ellipse cx="300" cy="155" rx="250" ry="110" fill="#3498db" fill-opacity="0.08" stroke="#3498db" stroke-width="2"/>
  <text x="510" y="60" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="13" font-weight="bold" fill="#3498db">NP</text>
  <text x="510" y="76" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="9" fill="#3498db">可在多项式时间</text>
  <text x="510" y="88" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="9" fill="#3498db">验证</text>

  <!-- P inner ellipse -->
  <ellipse cx="220" cy="155" rx="140" ry="80" fill="#27ae60" fill-opacity="0.12" stroke="#27ae60" stroke-width="2"/>
  <text x="160" y="150" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="13" font-weight="bold" fill="#27ae60">P</text>
  <text x="160" y="166" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="9" fill="#27ae60">可在多项式时间</text>
  <text x="160" y="178" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="9" fill="#27ae60">求解</text>

  <!-- NP-complete region -->
  <ellipse cx="420" cy="155" rx="80" ry="65" fill="#e74c3c" fill-opacity="0.12" stroke="#e74c3c" stroke-width="2"/>
  <text x="420" y="140" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="11" font-weight="bold" fill="#e74c3c">NP 完全</text>
  <text x="420" y="156" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="9" fill="#e74c3c">NP 中最难的问题</text>

  <!-- Example problems -->
  <text x="190" y="120" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="8" fill="#27ae60">排序</text>
  <text x="240" y="195" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="8" fill="#27ae60">最短路径</text>
  <text x="270" y="130" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="8" fill="#27ae60">素性测试</text>

  <text x="420" y="172" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="8" fill="#e74c3c">SAT、TSP</text>
  <text x="420" y="185" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="8" fill="#e74c3c">图着色</text>

  <!-- Question mark -->
  <text x="330" y="160" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="24" font-weight="bold" fill="#f39c12">?</text>
  <text x="330" y="180" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="9" fill="#f39c12">P = NP?</text>

  <text x="300" y="275" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="10" fill="#666">若 P = NP，绿色圆将扩展并填满蓝色圆（多数专家认为 P ≠ NP）</text>
</svg>
