<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <marker id="ads-arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7" fill="none" stroke="#666" stroke-width="1.2"/>
    </marker>
  </defs>
  <text x="400" y="22" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">自动驾驶技术栈</text>

  <!-- Sensors -->
  <rect x="20" y="65" width="100" height="70" rx="10" fill="#555" fill-opacity="0.1" stroke="#555" stroke-width="1.5"/>
  <text x="70" y="90" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="11" font-weight="bold" fill="#555">传感器</text>
  <text x="70" y="107" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="9" fill="#555">相机、LiDAR</text>
  <text x="70" y="120" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="9" fill="#555">雷达、IMU</text>

  <line x1="120" y1="100" x2="148" y2="100" stroke="#666" stroke-width="2" marker-end="url(#ads-arr)"/>

  <!-- Perception -->
  <rect x="156" y="55" width="120" height="90" rx="10" fill="#3498db" fill-opacity="0.12" stroke="#3498db" stroke-width="2"/>
  <text x="216" y="85" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="12" font-weight="bold" fill="#3498db">感知</text>
  <text x="216" y="102" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="9" fill="#3498db">三维检测</text>
  <text x="216" y="115" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="9" fill="#3498db">车道检测</text>
  <text x="216" y="128" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="9" fill="#3498db">占据</text>

  <line x1="276" y1="100" x2="304" y2="100" stroke="#666" stroke-width="2" marker-end="url(#ads-arr)"/>

  <!-- Prediction -->
  <rect x="312" y="55" width="120" height="90" rx="10" fill="#f39c12" fill-opacity="0.12" stroke="#f39c12" stroke-width="2"/>
  <text x="372" y="85" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="12" font-weight="bold" fill="#f39c12">预测</text>
  <text x="372" y="102" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="9" fill="#f39c12">轨迹预测</text>
  <text x="372" y="115" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="9" fill="#f39c12">意图估计</text>
  <text x="372" y="128" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="9" fill="#f39c12">3--8 秒时域</text>

  <line x1="432" y1="100" x2="460" y2="100" stroke="#666" stroke-width="2" marker-end="url(#ads-arr)"/>

  <!-- Planning -->
  <rect x="468" y="55" width="120" height="90" rx="10" fill="#27ae60" fill-opacity="0.12" stroke="#27ae60" stroke-width="2"/>
  <text x="528" y="85" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">规划</text>
  <text x="528" y="102" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="9" fill="#27ae60">路径规划</text>
  <text x="528" y="115" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="9" fill="#27ae60">轨迹优化</text>
  <text x="528" y="128" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="9" fill="#27ae60">决策</text>

  <line x1="588" y1="100" x2="616" y2="100" stroke="#666" stroke-width="2" marker-end="url(#ads-arr)"/>

  <!-- Control -->
  <rect x="624" y="55" width="120" height="90" rx="10" fill="#9b59b6" fill-opacity="0.12" stroke="#9b59b6" stroke-width="2"/>
  <text x="684" y="85" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="12" font-weight="bold" fill="#9b59b6">控制</text>
  <text x="684" y="102" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="9" fill="#9b59b6">转向</text>
  <text x="684" y="115" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="9" fill="#9b59b6">油门</text>
  <text x="684" y="128" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="9" fill="#9b59b6">制动</text>

  <!-- Information flow label -->
  <text x="400" y="178" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="10" fill="#666">每个阶段将原始数据提炼为更抽象的决策</text>
  <text x="400" y="195" text-anchor="middle" font-family="'Noto Sans SC', 'Microsoft YaHei', Arial, sans-serif" font-size="10" fill="#999">错误会向前传播 → 感知质量是瓶颈</text>
</svg>
