<svg width="520" height="220" xmlns="http://www.w3.org/2000/svg">
  <text x="260" y="25" fill="#333" font-size="14" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-weight="bold" text-anchor="middle">语素分析：“unhappiness”</text>

  <!-- Root word at top -->
  <rect x="170" y="40" width="180" height="36" rx="8" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
  <text x="260" y="64" fill="#333" font-size="15" text-anchor="middle" font-weight="bold">unhappiness</text>

  <!-- Branches -->
  <line x1="210" y1="76" x2="110" y2="120" stroke="#555" stroke-width="1.5"/>
  <line x1="260" y1="76" x2="260" y2="120" stroke="#555" stroke-width="1.5"/>
  <line x1="310" y1="76" x2="410" y2="120" stroke="#555" stroke-width="1.5"/>

  <!-- Prefix: un -->
  <rect x="60" y="120" width="100" height="36" rx="8" fill="#e74c3c" opacity="0.15" stroke="#e74c3c" stroke-width="2"/>
  <text x="110" y="143" fill="#e74c3c" font-size="14" text-anchor="middle" font-weight="bold">un-</text>
  <text x="110" y="175" fill="#e74c3c" font-size="11" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle">前缀</text>
  <text x="110" y="190" fill="#e74c3c" font-size="10" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle">“非”</text>

  <!-- Root: happy -->
  <rect x="200" y="120" width="120" height="36" rx="8" fill="#3498db" opacity="0.15" stroke="#3498db" stroke-width="2"/>
  <text x="260" y="143" fill="#3498db" font-size="14" text-anchor="middle" font-weight="bold">happy</text>
  <text x="260" y="175" fill="#3498db" font-size="11" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle">词根</text>
  <text x="260" y="190" fill="#3498db" font-size="10" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle">（形容词）</text>

  <!-- Suffix: ness -->
  <rect x="360" y="120" width="100" height="36" rx="8" fill="#27ae60" opacity="0.15" stroke="#27ae60" stroke-width="2"/>
  <text x="410" y="143" fill="#27ae60" font-size="14" text-anchor="middle" font-weight="bold">-ness</text>
  <text x="410" y="175" fill="#27ae60" font-size="11" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle">后缀</text>
  <text x="410" y="190" fill="#27ae60" font-size="10" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle">形容词 → 名词</text>

  <!-- Result label -->
  <text x="260" y="215" fill="#666" font-size="9" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle">3 个语素：前缀 + 词根 + 后缀 → 派生名词，表示“并不快乐的状态”</text>
</svg>
