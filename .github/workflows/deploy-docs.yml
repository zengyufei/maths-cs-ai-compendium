name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install "mkdocs<2" "mkdocs-material[imaging]" ghp-import

      - name: Check MCP server
        run: |
          npm --prefix mcp install
          npm --prefix mcp run check
          npm --prefix mcp test

      - name: Build English and Chinese sites
        run: node scripts/build-docs.mjs

      - name: Deploy combined site
        run: ghp-import -n -p -f site
